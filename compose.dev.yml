services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: hilko
      POSTGRES_PASSWORD: hilko_dev
      POSTGRES_DB: hilko
    ports:
      - "5432:5432"
    volumes:
      - hilko_pg_dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hilko -d hilko"]
      interval: 5s
      timeout: 5s
      retries: 5

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "8025:8025"
      - "1025:1025"

volumes:
  hilko_pg_dev: