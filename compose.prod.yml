services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-hilko}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-hilko}
    volumes:
      - hilko_pg_prod:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-hilko} -d ${POSTGRES_DB:-hilko}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  app:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-hilko}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-hilko}
      NUXT_SESSION_SECRET: ${NUXT_SESSION_SECRET:?set NUXT_SESSION_SECRET}
      NUXT_PUBLIC_APP_URL: ${NUXT_PUBLIC_APP_URL:-https://localhost}
      NUXT_SMTP_HOST: ${NUXT_SMTP_HOST:-}
      NUXT_SMTP_PORT: ${NUXT_SMTP_PORT:-587}
      HILKO_ALLOW_PUBLIC_REGISTER: ${HILKO_ALLOW_PUBLIC_REGISTER:-true}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app
    restart: unless-stopped

volumes:
  hilko_pg_prod:
  caddy_data:
  caddy_config: